name: YamLMS Production CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

jobs:
    # ==========================================================
    # STAGE 1 & 2: BUILD AND TESTS (ALWAYS ACTIVE)
    # ==========================================================
    build-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install NPM Dependencies
              run: npm ci

            - name: Compile Assets (Vite)
              run: npm run build

            - name: Upload Vite Assets
              uses: actions/upload-artifact@v5
              with:
                  name: vite-assets
                  path: public/build/
                  retention-days: 1

    build-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  tools: composer:v2
                  coverage: none

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer Dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer Dependencies
              run: composer install --no-interaction --prefer-dist --no-ansi --no-progress

            - name: Upload Vendor Directory
              uses: actions/upload-artifact@v5
              with:
                  name: php-vendor
                  path: vendor/
                  retention-days: 1

    execute-tests:
        runs-on: ubuntu-latest
        needs: [build-frontend, build-backend]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: sqlite, pdo_sqlite, mbstring, gd
                  coverage: none

            - name: Download Vite Assets
              uses: actions/download-artifact@v5
              with:
                  name: vite-assets
                  path: public/build/

            - name: Download PHP Vendor
              uses: actions/download-artifact@v5
              with:
                  name: php-vendor
                  path: vendor/

            - name: Run test suite
              env:
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  STRIPE_KEY: 'pk_test_mock'
                  STRIPE_SECRET: 'sk_test_mock'
                  STRIPE_WEBHOOK_SECRET: 'whsec_mock'
                  APP_ENV: testing
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  php artisan test

    code-linting:
        runs-on: ubuntu-latest
        needs: [build-backend]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  tools: pint
                  coverage: none

            - name: Download PHP Vendor
              uses: actions/download-artifact@v5
              with:
                  name: php-vendor
                  path: vendor/

            - name: Restore Executable Permissions
              run: chmod +x vendor/bin/*

            - name: Run Laravel Pint
              run: vendor/bin/pint --test

    # ==========================================================
    # STAGE 3: CHOOSE YOUR LIVE DEPLOYMENT METHOD
